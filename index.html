<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EQUIPAR SAS – Redireccionando…</title>

  <!-- Redirección automática en 5 segundos -->
  <meta http-equiv="refresh" content="5;url=https://ingequipar.wixsite.com/equipar">

  <!-- Redirección alternativa por JavaScript -->
  <script>
    setTimeout(function () {
      window.location.href = "https://ingequipar.wixsite.com/equipar";
    }, 5000);
  </script>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f6f9;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      padding: 20px;
    }

    .logo {
      max-width: 220px;
      margin-bottom: 20px;
    }

    .loader {
      border: 6px solid #ddd;
      border-top: 6px solid #ffcc00;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    a {
      color: #004080;
      font-weight: bold;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="LOGO DORADO.png" alt="Logo EQUIPAR SAS" class="logo">

    <h2>Disculpe las molestias</h2>
    <p>Pronto será redirigido a la página oficial de <strong>EQUIPAR SAS</strong>.</p>

    <div class="loader"></div>

    <p>Si la redirección no ocurre automáticamente, haga clic 
      <a href="https://ingequipar.wixsite.com/equipar">aquí</a>.
    </p>
  </div>
</body>
</html>
