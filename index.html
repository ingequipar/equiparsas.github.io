<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>EQUIPAR SAS - Página en construcción</title>

      height: 100vh;
    }

      border-top: 8px solid #003366;
    }
    h1 {
      color: #003366;
      margin-top: 20px;
      margin-bottom: 10px;

    }
    p {
      color: #333333;
      font-size: 16px;
      margin: 8px 0;
    }
    .alert {
      color: #E30613;
      font-weight: bold;
      font-size: 18px;
    }
    a {
      color: #003366;
      font-weight: bold;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    img {
      width: 180px;
      margin-bottom: 10px;

  <script>
    // Redirección por JavaScript como respaldo

<body>
  <div class="card">

    <!-- Logo cargado desde archivo -->
